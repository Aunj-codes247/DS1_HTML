<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>

<body>
    <fieldset>
        <!-- <form action="#" name="" target="" method=""> -->
        <form action="#">
            <label for="name">UserName:</label>
            <input type="text" placeholder="something to put on" id="name" name="name" required>
            <br>
            <br>
            <label for="pass">Password:</label>
            <input type="password" name="pass" id="pass" placeholder="enter your password">

            <br>
            <br>
            <label for="email">email:</label>
            <input type="email" name="email" id="email" placeholder="enter your email">
            <br>
            <br>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="gender">
            
            <label for="gender">Male:</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Female:</label>
            <br><br>

            <label for="hobb"> Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb1">
            <label for="hobb1">Cricket</label>
            <input type="checkbox" name="hobb2" id="hobb2">
            <label for="hobb2">Football:</label>

            <br><br>



            <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob">


            <br><br>
            <label for="lang">Select programming Lang</label>
            <select name="lang" id="lang" >
                <option value="select lang">select lang</option>
                <option value="C">C</option>
                <option value="CPP">CPP</option>
                <option value="Python">Python</option>
                <option value="JAVA">JAVA</option>


            </select>









        </form>
    </fieldset>

</body>

</html>
